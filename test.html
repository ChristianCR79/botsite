<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botsite – Hans schreiben</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 48px; height: 48px;
      background: #c9922a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    h1 { font-size: 1.25rem; color: #1a1a1a; }
    h1 span { font-size: 0.85rem; color: #888; font-weight: 400; display: block; }

    label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .field { margin-bottom: 1.25rem; }

    input[type="text"], textarea {
      width: 100%; padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0; border-radius: 10px;
      font-size: 0.95rem; font-family: inherit; color: #1a1a1a;
      transition: border-color 0.2s;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #c9922a; }
    textarea { height: 120px; resize: vertical; }

    .attach-area {
      border: 2px dashed #e0e0e0; border-radius: 10px;
      padding: 1.25rem; text-align: center; cursor: pointer;
      transition: all 0.2s; background: #fafafa;
    }
    .attach-area:hover { border-color: #c9922a; background: #fff9f0; }
    .attach-area input { display: none; }
    .attach-icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .attach-text { font-size: 0.85rem; color: #888; }
    .attach-text strong { color: #c9922a; }

    .preview-list { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .preview-item {
      position: relative; width: 64px; height: 64px;
      border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-item .remove {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,0.6); color: #fff; border: none;
      width: 18px; height: 18px; border-radius: 50%; font-size: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .send-btn {
      width: 100%; padding: 1rem;
      background: #c9922a; color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .send-btn:hover:not(:disabled) { background: #a87820; transform: translateY(-1px); }
    .send-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

    .result {
      margin-top: 1.25rem; padding: 1rem 1.25rem;
      border-radius: 10px; font-size: 0.9rem; display: none;
      line-height: 1.6;
    }
    .result.success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    .result.error   { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .result.loading { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; }

    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.5rem 0; }

    .tip {
      font-size: 0.8rem; color: #aaa; text-align: center; margin-top: 1rem;
    }
    .tip code {
      background: #f5f5f5; padding: 0.1rem 0.4rem;
      border-radius: 4px; font-size: 0.78rem; color: #666;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="avatar">🤖</div>
    <div>
      <h1>Hans schreiben
        <span>hans@mail.wdii.studio</span>
      </h1>
    </div>
  </div>

  <!-- Absender-E-Mail -->
  <div class="field">
    <label>Deine E-Mail-Adresse (Hans antwortet hierhin)</label>
    <input type="text" id="senderEmail" placeholder="deine@email.com" />
  </div>

  <!-- Betreff -->
  <div class="field">
    <label>Betreff / Anweisung</label>
    <input type="text" id="subject" placeholder="z.B. Öffnungszeiten Freitag auf 08:00 – 20:00 ändern" />
  </div>

  <!-- Nachricht -->
  <div class="field">
    <label>Nachricht (optional)</label>
    <textarea id="body" placeholder="Lieber Hans, bitte ändere…"></textarea>
  </div>

  <!-- Anhänge -->
  <div class="field">
    <label>Bilder anhängen (optional)</label>
    <div class="attach-area" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" multiple onchange="addFiles(this.files)" />
      <div class="attach-icon">📎</div>
      <div class="attach-text">Klicken oder Bild hierher ziehen<br><strong>JPG, PNG, GIF, WEBP</strong></div>
    </div>
    <div class="preview-list" id="previewList"></div>
  </div>

  <button class="send-btn" id="sendBtn" onclick="send()">
    📨 An Hans schicken
  </button>

  <div class="result" id="result"></div>

  <p class="tip">Webhook: <code>botsite-iota.vercel.app/webhook</code></p>
</div>

<script>
  const attachments = [];

  // Drag & Drop
  const attachArea = document.querySelector('.attach-area');
  attachArea.addEventListener('dragover', e => { e.preventDefault(); attachArea.style.borderColor = '#c9922a'; });
  attachArea.addEventListener('dragleave', () => { attachArea.style.borderColor = '#e0e0e0'; });
  attachArea.addEventListener('drop', e => {
    e.preventDefault();
    attachArea.style.borderColor = '#e0e0e0';
    addFiles(e.dataTransfer.files);
  });

  function addFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = e.target.result.split(',')[1];
        const id = Date.now() + Math.random();
        attachments.push({ id, filename: file.name, contentType: file.type, content: base64, preview: e.target.result });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    const list = document.getElementById('previewList');
    list.innerHTML = attachments.map(a => `
      <div class="preview-item">
        <img src="${a.preview}" alt="${a.filename}" />
        <button class="remove" onclick="removeAttachment('${a.id}')">✕</button>
      </div>`).join('');
  }

  function removeAttachment(id) {
    const i = attachments.findIndex(a => String(a.id) === String(id));
    if (i !== -1) attachments.splice(i, 1);
    renderPreviews();
  }

  async function send() {
    const sender  = document.getElementById('senderEmail').value.trim() || 'test@botsite-test.com';
    const subject = document.getElementById('subject').value.trim();
    const body    = document.getElementById('body').value.trim();
    const result  = document.getElementById('result');
    const btn     = document.getElementById('sendBtn');

    if (!subject && !body) {
      result.className = 'result error';
      result.style.display = 'block';
      result.textContent = '⚠️ Bitte schreib mindestens einen Betreff.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '⏳ Hans denkt nach…';
    result.className = 'result loading';
    result.style.display = 'block';
    result.textContent = 'Anfrage wird verarbeitet…';

    const payload = {
      type: 'email.received',
      data: {
        from:    sender,
        to:      ['hans@mail.wdii.studio'],
        subject: subject || '(Kein Betreff)',
        text:    body || subject, // Betreff als Fallback
        attachments: attachments.map(a => ({
          filename:    a.filename,
          contentType: a.contentType,
          content:     a.content,
        })),
      }
    };

    try {
      const res  = await fetch('https://botsite-iota.vercel.app/webhook', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.success) {
        const icons = { 'ÄNDERUNG': '✅', 'RÜCKFRAGE': '❓', 'DATEIEN': '📎', 'KOMPLEX': '⚠️' };
        result.className = 'result success';
        result.innerHTML =
          `${icons[data.action] || '✅'} <strong>${data.action}</strong><br>` +
          `${data.reasoning || ''}<br><br>` +
          (data.action === 'ÄNDERUNG'
            ? '→ <a href="https://christiancr79.github.io/botsite" target="_blank">Website ansehen</a> — neuer Commit sollte erschienen sein!'
            : '→ Hans hat per E-Mail geantwortet.');
      } else {
        result.className = 'result error';
        result.textContent = '❌ Fehler: ' + JSON.stringify(data);
      }
    } catch (e) {
      result.className = 'result error';
      result.textContent = '❌ Verbindungsfehler: ' + e.message;
    }

    btn.disabled = false;
    btn.innerHTML = '📨 An Hans schicken';
  }
</script>
</body>
</html>
